name: CI

# 只在 PR 上跑：lint → 單元測試 → build。
# push 到 main 的檢查併在 deploy.yml 裡（部署前會先 lint + test），避免同一次 push 跑兩份 build。
# 只改資料或文件的 PR 不需要跑這個：資料由 validate-pr.yml 驗證 schema。
on:
  pull_request:
    paths-ignore:
      - 'festivals/**'
      - 'docs/**'
      - '**.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
